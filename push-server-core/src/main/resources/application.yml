spring:
  application:
    name: push-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:@spring.profiles.active@}
  config:
    additional-location: "optional:file:./config/"
  main:
    allow-bean-definition-overriding: true
  web:
    resources:
      static-locations: "file:./dist/, classpath:/static/" # 优先找本地 dist，找不到找包内 static

info:
  app:
    version: @project.version@

server:
  port: 8000
  forward-headers-strategy: framework
#  yDEHjQUcqGgD

push:
  portal:
    wecom:
      base-url: ${PUSH_PORTAL_WECOM_BASE_URL:https://qyapi.weixin.qq.com}
      public-base-url: ${PUSH_PORTAL_WECOM_PUBLIC_BASE_URL:https://juhe.beichenwl.cn}
      authorization-callback-url: ${PUSH_PORTAL_WECOM_AUTH_CALLBACK_URL:https://u.beichenwl.cn/wework_suite_install_return.php}
      internal-api-key: ${PUSH_PORTAL_WECOM_INTERNAL_API_KEY:78099209}
      client-redirects:
        u-login: ${PUSH_PORTAL_WECOM_U_LOGIN_REDIRECT_URL:https://u.beichenwl.cn/wework_suite_install_return.php}

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
